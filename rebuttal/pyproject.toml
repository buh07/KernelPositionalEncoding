[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "si-rebuttal"
version = "0.1.0"
description = "Frozen configuration, data materialization, and provenance for the SI rebuttal."
requires-python = ">=3.11"
dependencies = [
  "torch==2.7.0",
  "transformers==5.3.0",
  "datasets==4.8.2",
  "numpy==1.26.4",
  "scipy==1.11.4",
  "pandas==2.1.4",
  "pyarrow==23.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest==7.4.4",
  "ruff==0.12.5",
  "basedpyright==1.31.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]

[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
reportMissingTypeStubs = false
